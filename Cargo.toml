[package]
name = "kite"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gix = { version = "0.85", default-features = false, features = ["sha1", "excludes"] }
openai-oxide = "0.17"
ratatui = { version = "0.30", default-features = false, features = ["termwiz"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
tui-markdown = "0.3.9"
termwiz = "0.23"
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.27.0"
test-files = "0.1.2"
